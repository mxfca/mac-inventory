version: "2"

linters:
  # Keeps the default linters (govet included) and adds gosec, gocognit, contextcheck and noctx.
  enable:
    - gosec
    - gocognit
    - contextcheck
    - noctx
  settings:
    gocognit:
      min-complexity: 15

formatters:
  enable:
    - goimports
  settings:
    goimports:
      # Imports of this module go in their own group, after the standard library and dependencies.
      local-prefixes:
        - github.com/mxfca/mac-inventory
